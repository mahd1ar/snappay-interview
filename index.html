<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#ffffff">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>لوازم خودرو | اسنپ‌پی</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23008dfa'/%3E%3Cpath d='M7 19.5 9 13.8A3 3 0 0 1 11.8 12h8.4A3 3 0 0 1 23 13.8l2 5.7V23h-2.5v-1.5h-13V23H7z' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="preload" href="./assets/images/hero/automotive-hero-new.webp" as="image" fetchpriority="high">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="./assets/css/base.css">
  <link rel="stylesheet" href="./assets/css/hero.css">
  <link rel="stylesheet" href="./assets/css/categories.css">
  <link rel="stylesheet" href="./assets/css/products.css">
  <link rel="stylesheet" href="./assets/css/merchants.css">
  <link rel="stylesheet" href="./assets/css/coupons.css">
  <link rel="stylesheet" href="./assets/css/tiles.css">
  <link rel="stylesheet" href="./assets/css/stores.css">
  <link rel="stylesheet" href="./assets/css/panel.css">
  <script type="module" src="./assets/js/app.js"></script>
</head>
<body>
  <main class="sp-shell" id="main-content">
    <!-- 1. Hero -->
    <section class="sp-hero" id="hero" aria-labelledby="hero-title" data-section-id="hero">
      <div class="sp-hero-scene" id="hero-scene">
        <img class="sp-hero__image" src="./assets/images/hero/automotive-hero-new.webp" width="1024" height="1024"
          fetchpriority="high" loading="eager" decoding="async" alt="">
        <div class="sp-hero-labels" id="hero-labels"></div>
      </div>
      <div class="sp-hero-copy">
        <h1 class="sp-hero-title" id="hero-title">لوازم خودرو</h1>
        <p class="sp-hero-description">هرچه خودروت لازم دارد، از فروشگاه‌های همراه اسنپ‌پی</p>
      </div>
    </section>

    <section class="sp-global-search" aria-label="جست‌وجوی فروشگاه‌های خودرو">
      <button class="sp-global-search-open" id="global-search-open" type="button" aria-haspopup="dialog" aria-controls="sp-panel">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg>
        <span>جست‌وجو در فروشگاه‌های خودرو</span>
      </button>
    </section>

    <!-- 2. Subcategories, two rows moving in opposite directions -->
    <section class="sp-section sp-categories" id="subcategories" aria-labelledby="subcategories-title" data-section-id="subcategories">
      <h2 class="sp-section-title" id="subcategories-title">دسته‌بندی‌ها</h2>
      <p class="sp-visually-hidden" id="subcategories-help">هر ردیف را به چپ یا راست بکشید و برای دیدن فروشگاه‌ها یک دسته را انتخاب کنید.</p>
      <div class="sp-region" data-region="subcategories" aria-busy="true" aria-describedby="subcategories-help"></div>
    </section>

    <!-- 3. Products -->
    <section class="sp-section sp-offers" id="products" aria-labelledby="products-title" data-section-id="products">
      <header class="sp-section-heading">
        <h2 class="sp-section-title" id="products-title">محصولات پیشنهادی خودرو</h2>
        <button type="button" class="sp-view-all" data-view-all="products" aria-haspopup="dialog" aria-controls="sp-panel">مشاهده همه</button>
      </header>
      <div class="sp-region" data-region="products" aria-busy="true"></div>
    </section>

    <!-- 4. Merchants -->
    <section class="sp-section sp-merchant-rail" id="merchants" aria-labelledby="merchants-title" data-section-id="merchants">
      <header class="sp-section-heading">
        <h2 class="sp-section-title" id="merchants-title">فروشگاه‌های برگزیده</h2>
        <button type="button" class="sp-view-all" data-view-all="merchants" aria-haspopup="dialog" aria-controls="sp-panel">مشاهده همه</button>
      </header>
      <div class="sp-region" data-region="merchants" aria-busy="true"></div>
    </section>

    <!-- 5. Coupons -->
    <section class="sp-section sp-coupons" id="coupons" aria-labelledby="coupons-title" data-section-id="coupons">
      <header class="sp-section-heading">
        <h2 class="sp-section-title" id="coupons-title">کدهای تخفیف</h2>
        <span class="sp-section-hint">کد را کپی کن و موقع خرید وارد کن</span>
      </header>
      <div class="sp-region" data-region="coupons" aria-busy="true"></div>
    </section>

    <!-- 6. Three merchant tiles -->
    <section class="sp-section sp-tiles" id="feature-tiles" aria-label="پیشنهادهای ویژه خودرو" data-section-id="feature_tiles">
      <div class="sp-region" data-region="feature_tiles" aria-busy="true"></div>
    </section>

    <!-- 7. Stores -->
    <section class="sp-section sp-stores" id="stores" aria-labelledby="stores-title" data-section-id="stores">
      <header class="sp-section-heading">
        <h2 class="sp-section-title" id="stores-title">همه فروشگاه‌های خودرو</h2>
        <button type="button" class="sp-view-all" data-view-all="stores" aria-haspopup="dialog" aria-controls="sp-panel">مشاهده همه</button>
      </header>
      <div class="sp-region" data-region="stores" aria-busy="true"></div>
    </section>

    <footer class="sp-footer" id="sp-footer"></footer>

    <noscript>
      <style>.sp-section,.sp-global-search{display:none}</style>
      <p class="sp-status">برای نمایش دسته‌بندی‌ها و پیشنهادها، جاوااسکریپت باید فعال باشد.</p>
    </noscript>
  </main>

  <dialog class="sp-panel" id="sp-panel" aria-labelledby="sp-panel-title">
    <header class="sp-panel-header">
      <button class="sp-panel-back" id="sp-panel-back" type="button" aria-label="بازگشت">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m14 5 7 7-7 7M21 12H3"/></svg>
      </button>
      <h2 id="sp-panel-title">فروشگاه‌ها</h2>
    </header>
    <div class="sp-panel-body" id="sp-panel-body"></div>
  </dialog>

  <div class="sp-toast" id="sp-toast" role="status" aria-live="polite"></div>
</body>
</html>
